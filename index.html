<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>RITAM WEBSITE ❤️</title>

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
        rel="stylesheet">


    <style>
        /* ==============================
           BASIC RESET
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* ==============================
           BODY
        ============================== */

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background-image: url("couple.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: "Playfair Display", serif;
        }


        /* ==============================
           DARK CINEMATIC OVERLAY
        ============================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(135deg,
                    rgba(0, 0, 0, 0.32),
                    rgba(0, 0, 0, 0.08),
                    rgba(0, 0, 0, 0.35));

            z-index: 0;

            pointer-events: none;
        }


        /* ==============================
           VIGNETTE
        ============================== */

        body::after {

            content: "";

            position: fixed;

            inset: 0;

            background:
                radial-gradient(circle,
                    transparent 35%,
                    rgba(0, 0, 0, 0.38) 100%);

            z-index: 0;

            pointer-events: none;
        }


        /* ==============================
           WATERMARK
        ============================== */

        .watermark {

            position: fixed;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%) rotate(-12deg);

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size:
                clamp(55px, 10vw, 140px);

            font-weight: 600;

            letter-spacing: 10px;

            white-space: nowrap;

            color:
                rgba(255, 255, 255, 0.20);

            text-shadow:
                0 5px 25px rgba(0, 0, 0, 0.30);

            user-select: none;

            pointer-events: none;

            z-index: 1;
        }


        /* ==============================
           GLASS QUESTION CARD
        ============================== */

        .question-box {

            position: relative;

            z-index: 5;

            width: min(520px, 88%);

            padding: 50px 45px;

            text-align: center;

            /* Strong Glass Effect */
            background:
                linear-gradient(135deg,
                    rgba(255, 255, 255, 0.24),
                    rgba(255, 255, 255, 0.08));

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            /* Glass Border */
            border:
                1px solid rgba(255, 255, 255, 0.38);

            border-radius: 30px;

            /* Premium Shadow */
            box-shadow:

                0 30px 80px rgba(0, 0, 0, 0.40),

                inset 0 1px 0 rgba(255, 255, 255, 0.35),

                inset 0 -1px 0 rgba(255, 255, 255, 0.08);

            animation:
                cardAppear 1s ease;
        }


        /* Glass Highlight */

        .question-box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 12%;

            width: 76%;
            height: 1px;

            background:
                rgba(255, 255, 255, 0.65);

            opacity: 0.6;
        }


        /* ==============================
           CARD ANIMATION
        ============================== */

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform:
                    translateY(30px) scale(0.94);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0) scale(1);
            }
        }


        /* ==============================
           QUESTION
        ============================== */

        h2 {

            color: white;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(27px, 5vw, 40px);

            font-weight: 600;

            letter-spacing: 1px;

            margin-bottom: 35px;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.45);
        }


        /* Small decorative line */

        h2::after {

            content: "";

            display: block;

            width: 55px;

            height: 2px;

            margin:
                18px auto 0;

            background:
                rgba(255, 255, 255, 0.65);

            border-radius: 10px;
        }


        /* ==============================
           BUTTON AREA
        ============================== */

        .buttons {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 18px;
        }


        /* ==============================
           ALL BUTTONS
        ============================== */

        button {

            border: none;

            padding:
                14px 32px;

            border-radius: 50px;

            font-family:
                "Playfair Display",
                serif;

            font-size: 16px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;

            outline: none;
        }


        /* ==============================
           YES BUTTON
        ============================== */

        #yesBtn {

            color: white;

            background:
                linear-gradient(135deg,
                    #ff6685,
                    #ff1744);

            box-shadow:
                0 10px 30px rgba(255, 23, 68, 0.38);
        }


        #yesBtn:hover {

            transform:
                translateY(-4px) scale(1.06);

            box-shadow:
                0 16px 40px rgba(255, 23, 68, 0.55);
        }


        #yesBtn:active {

            transform:
                scale(0.97);
        }


        /* ==============================
           NO BUTTON
        ============================== */

        #noBtn {

            color: white;

            background:
                rgba(255, 255, 255, 0.16);

            border:
                1px solid rgba(255, 255, 255, 0.30);

            backdrop-filter: blur(10px);

            -webkit-backdrop-filter: blur(10px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);
        }


        #noBtn:hover {

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.32);
        }


        /* ==============================
           VIDEO SCREEN
        ============================== */

        #videoContainer {

            display: none;

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            background: black;

            z-index: 9999;
        }


        #loveVideo {

            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .question-box {

                width: 90%;

                padding:
                    38px 22px;

                border-radius: 25px;
            }


            h2 {

                font-size: 27px;

                margin-bottom: 30px;
            }


            .buttons {

                gap: 12px;
            }


            button {

                padding:
                    12px 24px;

                font-size: 15px;
            }


            .watermark {

                font-size: 52px;

                letter-spacing: 4px;
            }
        }
    </style>

</head>


<body>


    <!-- ==============================
         WATERMARK
    ============================== -->

    <div class="watermark">
        RITAM WEBSITE ❤️
    </div>



    <!-- ==============================
         QUESTION CARD
    ============================== -->

    <div class="question-box" id="questionBox">

        <h2>
            Do you love me? ❤️
        </h2>


        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>


            <button id="noBtn">
                NO
            </button>

        </div>

    </div>



    <!-- ==============================
         VIDEO
    ============================== -->

    <div id="videoContainer">

        <video id="loveVideo" playsinline controls>

            <source src="video.mp4.mp4" type="video/mp4">

            Your browser does not support video.

        </video>

    </div>



    <script>

        /* ==============================
           GET ELEMENTS
        ============================== */

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const questionBox =
            document.getElementById("questionBox");

        const videoContainer =
            document.getElementById("videoContainer");

        const loveVideo =
            document.getElementById("loveVideo");



        /* ==============================
           MOVE NO BUTTON
        ============================== */

        function moveNoButton() {

            const maxX =
                Math.min(
                    280,
                    window.innerWidth * 0.35
                );

            const maxY =
                Math.min(
                    180,
                    window.innerHeight * 0.25
                );


            const x =
                Math.random() *
                (maxX * 2) -
                maxX;


            const y =
                Math.random() *
                (maxY * 2) -
                maxY;


            noBtn.style.transform =
                `translate(${x}px, ${y}px)`;
        }



        /* Desktop */

        noBtn.addEventListener(
            "mouseenter",
            moveNoButton
        );



        /* Mobile */

        noBtn.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNoButton();

            },
            {
                passive: false
            }
        );



        /* ==============================
           YES BUTTON
        ============================== */

        yesBtn.addEventListener(
            "click",
            async function () {

                /* Hide question */

                questionBox.style.display =
                    "none";


                /* Hide watermark */

                document
                    .querySelector(".watermark")
                    .style.display =
                    "none";


                /* Show video */

                videoContainer.style.display =
                    "block";


                /* Play video */

                try {

                    await loveVideo.play();

                }

                catch (error) {

                    console.log(
                        "Video playback error:",
                        error
                    );

                }

            }
        );

    </script>

</body>

</html>
