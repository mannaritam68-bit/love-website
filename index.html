
<!DOCTYPE html>
<html>

<head>

    <title>MY LOVE WEBSITE</title>

    <style>
        /* Full webpage background */
        body {
            margin: 0;
            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("download (4).jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
            overflow: hidden;
        }


        /* Question box */
        .box {
            width: 450px;
            padding: 50px;

            text-align: center;

            background: rgba(255, 255, 255, 0.90);

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.30);
        }


        /* Question */
        h2 {
            color: #000000;
            font-size: 35px;
            margin-bottom: 35px;
            text-align:center;
            margin-top: 20px;
        }

        h1 {
    text-align: center;
    font-size: 50px;
    top: 20px;
    position:absolute;

    /* Glass box */
    padding: 15px 30px;
    width: fit-content;
    margin: 20px auto;

    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 20px;

    /* Animated text */
    background-image: linear-gradient(
        90deg,
        #ff00cc,
        #3333ff,
        #00ffff,
        #ff00cc
    );
    background-size: 300%;

    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;

    animation: textColor 4s linear infinite;
}

@keyframes textColor {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}
       

        /* Buttons */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
        }


        button {
            width: 120px;
            padding: 15px;

            border: none;
            border-radius: 30px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }


        /* YES button */
        #yesBtn {
            background: #ff3366;
            color: white;
        }


        #yesBtn:hover {
            transform: scale(1.08);
        }


        /* NO button */
        #noBtn {
            background: #dddddd;
            color: #333333;

            position: relative;

            transition: transform 0.25s ease;
        }


        /* Video section */
        #videoContainer {
            display: none;

            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: black;

            z-index: 9999;
        }


        /* Full screen video */
        #loveVideo {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }
    </style>

</head>


<body>
    <h1><center>RITAM WEBSITE ❤️</center></h1>


    <!-- Question -->
     

    <div class="box" id="questionBox">

        <h2>
            Do you love me? ❤️
        </h2>
        


        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>


            <button id="noBtn">
                NO 😭
            </button>

        </div>

    </div>



    <!-- Full screen video -->

    <div id="videoContainer">

        <video id="loveVideo">

            <source src="video.mp4.mp4" type="video/mp4">

            Your browser does not support video.

        </video>

    </div>



    <script>


        // YES and NO buttons ko select karna

        const yesBtn = document.getElementById("yesBtn");

        const noBtn = document.getElementById("noBtn");


        // Question box

        const questionBox =
            document.getElementById("questionBox");


        // Video section

        const videoContainer =
            document.getElementById("videoContainer");


        // Video

        const loveVideo =
            document.getElementById("loveVideo");



        // NO button ke upar cursor jaane par

        noBtn.addEventListener("mouseenter", function () {


            // Random X position

            const x =
                Math.random() * 300 - 150;


            // Random Y position

            const y =
                Math.random() * 200 - 100;


            // NO button ko move karna

            noBtn.style.transform =
                "translate(" + x + "px, " + y + "px)";

        });



        // YES button click

        yesBtn.addEventListener("click", function () {


            // Question hide

            questionBox.style.display = "none";


            // Video container show

            videoContainer.style.display = "block";


            // Video start

            loveVideo.play();

        });


    </script>


</body>

</html>
