
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MY LOVE WEBSITE ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background-image: url("download (4).jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* =========================
           TITLE
        ========================= */

        h1 {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);

            margin: 0;
            padding: 12px 25px;

            font-size: 50px;
            text-align: center;
            white-space: nowrap;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;

            background-image: linear-gradient(90deg,
                    #ff00cc,
                    #3333ff,
                    #00ffff,
                    #ff00cc);

            background-size: 300%;

            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;

            animation: textColor 4s linear infinite;

            z-index: 10;
        }

        @keyframes textColor {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }

        /* =========================
           QUESTION BOX
        ========================= */

        .box {
            width: min(450px, 90%);
            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.90);

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.30);

            z-index: 5;
        }

        h2 {
            color: #000000;

            font-size: clamp(25px, 6vw, 35px);

            margin: 0 0 35px 0;
        }

        /* =========================
           BUTTONS
        ========================= */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 25px;

            min-height: 70px;
        }

        button {
            width: 120px;
            padding: 15px;

            border: none;
            border-radius: 30px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            transition: transform 0.2s ease;
        }

        /* YES */

        #yesBtn {
            background: #ff3366;
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.08);
        }

        /* NO */

        #noBtn {
            background: #dddddd;
            color: #333333;

            position: relative;

            transition: transform 0.20s ease;
        }

        /* =========================
           VIDEO
        ========================= */

        #videoContainer {
            display: none;

            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100dvh;

            background: black;

            z-index: 9999;
        }

        #loveVideo {
            width: 100%;
            height: 100%;

            object-fit: contain;

            background: black;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            h1 {
                top: 12px;

                font-size: 30px;

                padding: 10px 18px;

                max-width: 90%;
            }

            .box {
                width: 90%;

                padding: 35px 20px;

                border-radius: 20px;
            }

            h2 {
                font-size: 27px;

                margin-bottom: 30px;
            }

            .buttons {
                gap: 15px;
            }

            button {
                width: 105px;

                padding: 13px 10px;

                font-size: 16px;
            }
        }

        /* Small phones */

        @media (max-width: 380px) {

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 23px;
            }

            button {
                width: 95px;

                font-size: 15px;
            }
        }
    </style>
</head>


<body>

    <!-- TITLE -->

    <h1>RITAM WEBSITE ❤️</h1>


    <!-- QUESTION -->

    <div class="box" id="questionBox">

        <h2>
            Do you love me? ❤️
        </h2>

        <div class="buttons">

            <button id="yesBtn">
                YES ❤️
            </button>

            <button id="noBtn">
                NO 😭
            </button>

        </div>

    </div>


    <!-- VIDEO -->

    <div id="videoContainer">

        <video id="loveVideo" playsinline controls preload="metadata">

            <source src="video.mp4.mp4" type="video/mp4">

            Your browser does not support video.

        </video>

    </div>


    <script>

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const questionBox =
            document.getElementById("questionBox");

        const videoContainer =
            document.getElementById("videoContainer");

        const loveVideo =
            document.getElementById("loveVideo");


        /* =========================
           MOVE NO BUTTON
        ========================= */

        function moveNoButton() {

            const buttonRect =
                noBtn.getBoundingClientRect();

            const padding = 10;

            const maxX =
                (window.innerWidth -
                    buttonRect.width) / 2 - padding;

            const maxY =
                (window.innerHeight -
                    buttonRect.height) / 2 - padding;

            const x =
                (Math.random() * maxX * 2) - maxX;

            const y =
                (Math.random() * maxY * 2) - maxY;

            noBtn.style.transform =
                `translate(${x}px, ${y}px)`;
        }


        /* PC */

        noBtn.addEventListener(
            "mouseenter",
            moveNoButton
        );


        /* MOBILE */

        noBtn.addEventListener(
            "touchstart",
            function (event) {

                event.preventDefault();

                moveNoButton();
            },
            {
                passive: false
            }
        );


        /* =========================
           YES BUTTON
        ========================= */

        yesBtn.addEventListener(
            "click",
            async function () {

                questionBox.style.display =
                    "none";

                videoContainer.style.display =
                    "block";

                try {

                    await loveVideo.play();

                } catch (error) {

                    console.log(
                        "Video needs user interaction."
                    );

                }

            }
        );

    </script>

</body>

</html>
